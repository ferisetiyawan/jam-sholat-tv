name: jam_sholat_tv
description: "Jam Sholat TV"

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  wakelock_plus: ^1.2.8
  dio: ^5.4.1
  intl: ^0.19.0
  marquee: ^2.2.3
  audioplayers: ^6.5.1
  cached_network_image: ^3.4.1
  flutter_launcher_icons: ^0.14.4
  hijriyah_indonesia: ^0.1.7
  flutter_svg: ^2.2.3
  youtube_player_flutter: ^9.1.3
  provider: ^6.1.5+1
  logger: ^2.5.0
  connectivity_plus: ^7.0.0
  adhan_dart: ^2.0.1
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_static: ^1.1.3
  network_info_plus: ^8.2.1
  shared_preferences: ^2.5.5
  qr_flutter: ^4.1.0
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
    - assets/web/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/adaptive_icon_foreground.png"
